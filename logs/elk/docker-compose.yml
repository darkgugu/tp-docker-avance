version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elasticsearch.rule=Host(`elasticsearch.local`)"
      - "traefik.http.routers.elasticsearch.entrypoints=websecure"   # 👈 added
      - "traefik.http.routers.elasticsearch.tls=true"
      - "traefik.http.services.elasticsearch.loadbalancer.server.port=9200"
      # removed deprecated traefik.docker.network label
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elk
      - traefik

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    container_name: logstash
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.logstash.rule=Host(`logstash.local`)"
      - "traefik.http.routers.logstash.entrypoints=websecure"        # 👈 added
      - "traefik.http.routers.logstash.tls=true"
      - "traefik.http.services.logstash.loadbalancer.server.port=9600"
    networks:
      - elk
      - traefik
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kibana.rule=Host(`kibana.local`)"
      - "traefik.http.routers.kibana.entrypoints=websecure"          # 👈 added
      - "traefik.http.routers.kibana.tls=true"
      - "traefik.http.services.kibana.loadbalancer.server.port=5601"
    networks:
      - elk
      - traefik
    depends_on:
      - elasticsearch

volumes:
  esdata:

networks:
  elk:
    driver: bridge
  traefik:
    external: true