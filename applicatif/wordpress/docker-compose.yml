services:
  db:
    # We use a mariadb image which supports both amd64 & arm64 architecture
    image: mariadb:10.6.4-focal
    # If you really want to use MySQL, uncomment the following line
    #image: mysql:8.0.27
    command: '--default-authentication-plugin=mysql_native_password'
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=somewordpress
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=wordpress
    networks:
      - site1

  wordpress:
    image: wordpress:latest
    volumes:
      - wp_data:/var/www/html
    restart: always
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
    depends_on:
      - db
    networks:
      - site1
      - traefik
    labels:
      - traefik.enable=true

      - traefik.http.routers.wordpress.rule=Host(`wordpress.local`)
      - traefik.http.routers.wordpress.entrypoints=websecure
      - traefik.http.routers.wordpress.tls=true

      - traefik.http.routers.wordpress-http.rule=Host(`wordpress.local`)
      - traefik.http.routers.wordpress-http.entrypoints=web
      - traefik.http.routers.wordpress-http.middlewares=redirect-to-https

      - traefik.http.services.wordpress.loadbalancer.server.port=80
      
      - traefik.docker.network=traefik
    extra_hosts:
      - keycloak.local:host-gateway

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: wordpress
      PMA_PASSWORD: wordpress
    depends_on:
      - db
    networks:
      - site1
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.pma.rule=Host(`pma.wordpress.local`)
      - traefik.http.routers.pma.entrypoints=websecure
      - traefik.http.routers.pma.tls=true
      - traefik.http.routers.pma-http.rule=Host(`pma.wordpress.local`)
      - traefik.http.routers.pma-http.entrypoints=web
      - traefik.http.routers.pma-http.middlewares=redirect-to-https
      - traefik.http.services.pma.loadbalancer.server.port=80
      - traefik.docker.network=traefik

volumes:
  db_data:
  wp_data:

networks:
  site1:
    driver: bridge
    internal: true
  traefik:
    external: true