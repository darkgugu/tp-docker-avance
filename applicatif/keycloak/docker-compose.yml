services:
  keycloak:
    container_name: keycloak_app
    image: quay.io/keycloak/keycloak:latest
    restart: always
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}

      KC_HOSTNAME: keycloak.local
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false

      KC_DB: mariadb
      KC_DB_USERNAME: ${MARIADB_USER}
      KC_DB_PASSWORD: ${MARIADB_PASSWORD}
      KC_DB_URL_HOST: keycloak_db
      KC_DB_URL_DATABASE: keycloak

    depends_on:
      keycloak_db:
        condition: service_healthy

    networks:
      - keycloak-network
      - traefik

    labels:
      - traefik.enable=true

      - traefik.http.routers.keycloak.rule=Host(`keycloak.local`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=true

      - traefik.http.routers.keycloak-http.rule=Host(`keycloak.local`)
      - traefik.http.routers.keycloak-http.entrypoints=web
      #- traefik.http.routers.keycloak-http.middlewares=redirect-to-https

      - traefik.http.services.keycloak.loadbalancer.server.port=8080
      - traefik.docker.network=traefik

    command:
      - start
      
  keycloak_db:
    container_name: keycloak_db
    image: mariadb:10.6.4-focal
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: keycloak
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - ./mariadb:/var/lib/mysql
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ${MARIADB_USER} -p${MARIADB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  keycloak-network:
    name: keycloak-network
    driver: bridge
  traefik:
    external: true